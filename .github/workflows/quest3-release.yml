name: Quest 3 Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest3-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed Quest 3 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 8 for Godot Mono
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender unzip curl

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK" ]]; then
            echo "ERROR: GitHub runner Android SDK path is unavailable." >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          [[ -n "$SDKMANAGER" ]] || { echo "ERROR: sdkmanager not found." >&2; exit 1; }

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.1.0"

      - name: Install Godot 4.7.2 Mono
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"

          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$GODOT_ZIP"
          mkdir -p "$GODOT_DIR"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          rm -f "$GODOT_ZIP"

          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 3 -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          [[ -n "$GODOT_BIN" ]] || { echo "ERROR: Godot executable not found after extraction." >&2; exit 1; }
          chmod +x "$GODOT_BIN"

          GODOT_TEMPLATE_VERSION="$("$GODOT_BIN" --version | sed -E 's/\.official\..*$//')"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "GODOT_TEMPLATE_VERSION=$GODOT_TEMPLATE_VERSION" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install matching Godot Mono export templates
        shell: bash
        run: |
          set -euo pipefail
          TPZ="$RUNNER_TEMP/godot-templates.tpz"
          UNPACK="$RUNNER_TEMP/godot-templates"
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates"
          TEMPLATE_DIR="$TEMPLATE_ROOT/$GODOT_TEMPLATE_VERSION"
          URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz"

          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$TPZ"
          rm -rf "$UNPACK" "$TEMPLATE_DIR"
          mkdir -p "$UNPACK" "$TEMPLATE_ROOT"
          unzip -q "$TPZ" -d "$UNPACK"
          rm -f "$TPZ"

          [[ -d "$UNPACK/templates" ]] || { echo "ERROR: templates directory missing from TPZ." >&2; exit 1; }
          mv "$UNPACK/templates" "$TEMPLATE_DIR"
          rm -rf "$UNPACK"

          test -f "$TEMPLATE_DIR/android_source.zip"
          echo "GODOT_TEMPLATE_DIR=$TEMPLATE_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle Android build template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/build
          mkdir -p android/build
          unzip -q -o "$GODOT_TEMPLATE_DIR/android_source.zip" -d android/build
          touch android/build/.gdignore
          chmod +x android/build/gradlew
          printf '%s\n' "$GODOT_TEMPLATE_VERSION" > android/.build_version
          test -f android/build/gradlew

      - name: Install OpenXR Vendors 5.1
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install_openxr_vendors_5_1.sh
          test -f addons/godotopenxrvendors/plugin.gdextension

      - name: Restore and validate release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_B64" ]] || { echo "ERROR: ANDROID_RELEASE_KEYSTORE_B64 secret is missing." >&2; exit 1; }
          [[ -n "$STORE_PASSWORD" ]] || { echo "ERROR: ANDROID_RELEASE_KEYSTORE_PASSWORD secret is missing." >&2; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "ERROR: ANDROID_RELEASE_KEY_ALIAS secret is missing." >&2; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "ERROR: ANDROID_RELEASE_KEY_PASSWORD secret is missing." >&2; exit 1; }
          [[ "$STORE_PASSWORD" == "$KEY_PASSWORD" ]] || { echo "ERROR: Godot currently requires keystore and key passwords to match." >&2; exit 1; }

          mkdir -p .ci
          KEYSTORE_PATH="$GITHUB_WORKSPACE/.ci/vr-training-room-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Release keystore restored and validated."

      - name: Run Quest 3 preflight
        shell: bash
        run: |
          set -euo pipefail
          ./tools/quest3_preflight.sh

      - name: Build signed Quest 3 release APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/.ci/vr-training-room-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./tools/build_quest3_release.sh

      - name: Verify APK architecture, SDK and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/builds/quest3/vr-training-room-quest3-release.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

          test -s "$APK"

          echo "=== Native libraries ==="
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/.*\.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgodot_android.so'
          if unzip -l "$APK" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/.*\.so'; then
            echo "ERROR: APK contains a non-ARM64 native library architecture." >&2
            exit 1
          fi

          echo "=== APK badging ==="
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -E "package:|sdkVersion|targetSdkVersion|native-code|uses-feature"
          printf '%s\n' "$BADGING" | grep -q "sdkVersion:'32'"
          printf '%s\n' "$BADGING" | grep -q "targetSdkVersion:'34'"
          printf '%s\n' "$BADGING" | grep -q "native-code: 'arm64-v8a'"

          echo "=== Signature ==="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload signed Quest 3 release APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-training-room-quest3-release-${{ github.run_number }}
          path: |
            builds/quest3/vr-training-room-quest3-release.apk
            builds/quest3/vr-training-room-quest3-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored signing key
        if: always()
        shell: bash
        run: rm -f .ci/vr-training-room-release.keystore
